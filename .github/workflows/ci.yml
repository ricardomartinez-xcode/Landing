name: Landing CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/v90-public-billing-branding

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-Version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
